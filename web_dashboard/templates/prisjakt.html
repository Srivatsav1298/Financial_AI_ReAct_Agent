<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisjakt - Online Price Comparison | Norfain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@700;900&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                    colors: { brand: { dark: '#0f172a', primary: '#10b981' } },
                    animation: { 'bounce-slow': 'bounce 3s infinite', 'pulse-gentle': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            background-image: radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            color: #f8fafc;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .product-image {
            object-fit: contain;
            background: white;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col pb-32">

    <!-- Navbar -->
    <nav class="w-full relative z-50 border-b border-white/10 bg-slate-900/50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-20">
                <div class="cursor-pointer" onclick="window.location.href='/'">
                    <span
                        class="text-2xl font-display font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-500">Norfain</span>
                </div>
                <div class="hidden md:flex space-x-6 text-sm font-medium items-center">
                    <a href="/" class="text-gray-400 hover:text-white transition">Dashboard</a>
                    <a href="/groceries" class="text-gray-400 hover:text-white transition">Matbørsen</a>
                    <a href="#" class="text-emerald-400 border-b-2 border-emerald-400 pb-1">Prisjakt 💻</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex-grow container mx-auto px-4 py-8 max-w-7xl">
        <div class="flex flex-col lg:flex-row gap-8 items-start">

            <!-- Sidebar -->
            <div class="w-full lg:w-72 flex-shrink-0 lg:sticky lg:top-24 max-h-[85vh] flex flex-col gap-4">

                <div class="glass-card rounded-2xl p-4 overflow-hidden flex flex-col flex-1 max-h-[60vh] shadow-xl">
                    <!-- Search -->
                    <div class="relative mb-4">
                        <i class="fas fa-search absolute left-3 top-3 text-slate-500 text-sm"></i>
                        <input type="text" id="search-input" placeholder="Search products..."
                            class="w-full bg-slate-800/50 border border-white/10 rounded-xl pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500/50 transition placeholder-slate-500"
                            oninput="handleSearch(this.value)">
                    </div>

                    <!-- Categories -->
                    <div id="sidebar-tree" class="overflow-y-auto pr-2 space-y-2 flex-1">
                        <!-- Populated by JS -->
                        <div class="animate-pulse space-y-2">
                            <div class="h-4 bg-white/10 rounded w-3/4"></div>
                            <div class="h-4 bg-white/5 rounded w-1/2 ml-4"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Content -->
            <div class="flex-1 w-full relative">

                <!-- Header -->
                <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
                    <div>
                        <div class="flex items-center gap-3 text-emerald-400 text-xs font-mono mb-1">
                            <span class="bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20"><i
                                    class="fas fa-check-circle mr-1"></i> 100% Authentic Prices</span>
                            <span class="text-slate-500">•</span>
                            <span class="text-slate-400">Updated December 2025</span>
                        </div>
                        <h1 class="text-4xl font-display font-black text-white">Prisjakt</h1>
                        <p class="text-slate-400 text-sm mt-1">Compare prices across Norwegian online stores</p>
                    </div>

                    <!-- Filter Toggles -->
                    <div class="flex gap-2 flex-wrap">
                        <button onclick="toggleFilter('all')"
                            class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500 text-white border border-emerald-500"
                            data-filter="all">
                            <i class="fas fa-th mr-1"></i> All
                        </button>
                        <button onclick="toggleFilter('deals')"
                            class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800/50 text-slate-400 border border-white/10 hover:border-emerald-500/50 transition"
                            data-filter="deals">
                            <i class="fas fa-fire mr-1"></i> Best Deals
                        </button>
                    </div>
                </div>

                <!-- Product Grid -->
                <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    <!-- Populated by JS -->
                    <div class="col-span-full py-20 text-center">
                        <i class="fas fa-spinner fa-spin text-4xl text-emerald-500 mb-4"></i>
                        <p class="text-slate-400">Loading products...</p>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script>
        let allProducts = [];
        let activeFilter = 'all';
        let searchTerm = '';
        let openCategories = new Set(['Laptops', 'Smartphones']); // Default open

        // Init
        async function fetchProducts() {
            try {
                const res = await fetch('/api/prisjakt/products');
                const data = await res.json();
                if (data.success) {
                    allProducts = data.data;
                    renderSidebar();
                    renderGrid();
                }
            } catch (e) {
                console.error(e);
                document.getElementById('product-grid').innerHTML = `
                    <div class="col-span-full py-20 text-center">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
                        <p class="text-slate-400">Failed to load products</p>
                    </div>
                `;
            }
        }

        // Sidebar
        function renderSidebar() {
            const container = document.getElementById('sidebar-tree');
            const categories = {};

            allProducts.forEach(p => {
                if (!categories[p.category]) categories[p.category] = [];
                categories[p.category].push(p);
            });

            let html = '';
            Object.entries(categories).forEach(([cat, items]) => {
                const isOpen = openCategories.has(cat);
                const icon = isOpen ? 'fa-chevron-down' : 'fa-chevron-right';

                html += `
                    <div class="category-block">
                        <div class="flex items-center justify-between p-2 hover:bg-white/5 rounded-lg cursor-pointer transition"
                             onclick="toggleCategory('${cat}')">
                            <div class="flex items-center gap-2">
                                <i class="fas ${icon} text-[10px] text-slate-500"></i>
                                <span class="text-sm font-semibold text-white">${cat}</span>
                            </div>
                            <span class="text-xs text-slate-500">${items.length}</span>
                        </div>
                        <div class="ml-4 mt-1 space-y-1 ${isOpen ? '' : 'hidden'}" id="cat-${cat}">
                            ${items.map(p => `
                                <div class="text-xs text-slate-400 hover:text-emerald-400 cursor-pointer p-1.5 rounded hover:bg-white/5 transition truncate"
                                     onclick="scrollToProduct('${p.id}')">
                                    ${p.product}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function toggleCategory(cat) {
            if (openCategories.has(cat)) {
                openCategories.delete(cat);
            } else {
                openCategories.add(cat);
            }
            renderSidebar();
        }

        // Grid
        function renderGrid() {
            const container = document.getElementById('product-grid');
            let filtered = allProducts;

            // Apply search
            if (searchTerm) {
                filtered = filtered.filter(p =>
                    p.product.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    p.brand.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    p.category.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            // Apply filter
            if (activeFilter === 'deals') {
                filtered = filtered.filter(p => {
                    const bestPrice = Math.min(...p.prices.map(s => s.price));
                    return bestPrice < p.historical_avg;
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-20 text-center">
                        <i class="fas fa-search text-4xl text-slate-600 mb-4"></i>
                        <p class="text-slate-400">No products found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(p => createCard(p)).join('');
        }

        function createCard(item) {
            const bestPrice = Math.min(...item.prices.map(s => s.price));
            const bestStore = item.prices.find(s => s.price === bestPrice);
            const isDeal = bestPrice < item.historical_avg;
            const savings = item.historical_avg - bestPrice;

            return `
                <div id="${item.id}" class="glass-card rounded-2xl overflow-hidden hover:border-emerald-500/30 transition-all duration-300 flex flex-col">
                    <!-- Product Image -->
                    <div class="relative bg-white p-4 h-48 flex items-center justify-center">
                        <img src="${item.image}" alt="${item.product}" class="product-image max-h-full max-w-full">
                        ${isDeal ? `
                            <div class="absolute top-2 right-2 bg-emerald-500 text-white text-xs font-bold px-2 py-1 rounded-full">
                                <i class="fas fa-fire mr-1"></i> Save ${savings.toFixed(0)} kr
                            </div>
                        ` : ''}
                    </div>

                    <!-- Product Info -->
                    <div class="p-4 flex-1 flex flex-col">
                        <div class="mb-2">
                            <span class="text-xs text-emerald-400 font-medium">${item.brand}</span>
                            <h3 class="text-white font-semibold text-sm mt-1 leading-tight">${item.product}</h3>
                            <p class="text-xs text-slate-500 mt-1">${item.specs}</p>
                        </div>

                        <!-- Best Price -->
                        <div class="mt-auto pt-3 border-t border-white/10">
                            <div class="flex items-center justify-between mb-3">
                                <div>
                                    <p class="text-xs text-slate-500">Best price</p>
                                    <p class="text-2xl font-bold text-white tabular-nums">${bestPrice.toFixed(0)} <span class="text-sm text-slate-400">kr</span></p>
                                </div>
                                <a href="${bestStore.url}" target="_blank"
                                   class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-medium rounded-lg transition flex items-center gap-2">
                                    Visit ${bestStore.store} <i class="fas fa-external-link-alt text-[10px]"></i>
                                </a>
                            </div>

                            <!-- All Prices -->
                            <div class="space-y-1.5">
                                ${item.prices.sort((a, b) => a.price - b.price).map(store => `
                                    <div class="flex items-center justify-between text-xs ${store.price === bestPrice ? 'text-emerald-400 font-medium' : 'text-slate-400'}">
                                        <span>${store.store}</span>
                                        <a href="${store.url}" target="_blank" class="hover:text-white transition">
                                            ${store.price.toFixed(0)} kr <i class="fas fa-arrow-right text-[8px] ml-1"></i>
                                        </a>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function scrollToProduct(id) {
            document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function toggleFilter(filter) {
            activeFilter = filter;

            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.className = 'filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500 text-white border border-emerald-500';
                } else {
                    btn.className = 'filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800/50 text-slate-400 border border-white/10 hover:border-emerald-500/50 transition';
                }
            });

            renderGrid();
        }

        function handleSearch(value) {
            searchTerm = value;
            renderGrid();
        }

        // CPI Widget
        async function fetchCPIData() {
            try {
                const res = await fetch('/api/cpi');
                const data = await res.json();

                if (data.success) {
                    const cpi = data.data.current; // Updated to use new structure
                    const isPositive = cpi.yoy_change >= 0;
                    const changeColor = isPositive ? 'text-red-400' : 'text-green-400';
                    const changeIcon = isPositive ? 'fa-arrow-up' : 'fa-arrow-down';

                    document.getElementById('cpi-content').innerHTML = `
                        <div class="space-y-3">
                            <!-- Current CPI -->
                            <div class="text-center py-2">
                                <p class="text-xs text-slate-500 mb-1">Consumer Price Index</p>
                                <p class="text-4xl font-bold text-white tabular-nums">${cpi.index}</p>
                                <p class="text-[10px] text-slate-500 mt-1">${cpi.reference_base}</p>
                            </div>

                            <!-- Year-over-Year Change -->
                            <div class="bg-slate-800/50 rounded-lg p-3">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs text-slate-400">Since ${cpi.baseline_year}</span>
                                    <span class="${changeColor} text-sm font-bold tabular-nums flex items-center gap-1">
                                        <i class="fas ${changeIcon} text-[10px]"></i>
                                        ${Math.abs(cpi.yoy_change).toFixed(2)}%
                                    </span>
                                </div>
                            </div>

                            <!-- Multiplier Info -->
                            <div class="text-center">
                                <p class="text-[10px] text-slate-500">Price Multiplier</p>
                                <p class="text-lg font-mono text-emerald-400">${cpi.multiplier}x</p>
                                <p class="text-[9px] text-slate-600 mt-1">
                                    ${cpi.baseline_year} prices × ${cpi.multiplier} = Today's prices
                                </p>
                            </div>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || 'Failed to load CPI');
                }
            } catch (e) {
                console.error('CPI fetch error:', e);
                document.getElementById('cpi-content').innerHTML = `
                    <div class="text-center py-4">
                        <i class="fas fa-exclamation-triangle text-2xl text-red-500"></i>
                        <p class="text-xs text-slate-500 mt-2">Unable to load CPI data</p>
                    </div>
                `;
            }
        }

        window.onload = () => {
            fetchProducts();
        };
    </script>
</body>

</html>
