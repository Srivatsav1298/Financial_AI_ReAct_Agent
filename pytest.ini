# Pytest Configuration
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    unit: unit tests
    integration: integration tests
    slow: slow running tests
    requires_ollama: tests that require Ollama to be running
